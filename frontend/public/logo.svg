      />
    </g>
  </g>

  <!-- Right Side: Brand Typography -->
  <!-- "Go" (White) + "Drive" (Gold) -->
  <text x="290" y="145" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Go</tspan><tspan fill="#F59E0B">Drive</tspan>
  </text>

  <!-- "SELF DRIVE" Subtitle with Emerald Dot -->
  <text x="294" y="208" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="30" fill="#FBBF24" letter-spacing="12">SELF DRIVE</text>
  
  <!-- Active Live Pulse Green Dot -->
  <circle cx="675" cy="198" r="7" fill="#10B981" />
